name: Build images

# Build once per commit: the app image and the migrations image, both tagged
# with the short git SHA. PRs only prove the images build; pushes to main
# publish them. Deploying is a separate step (brightpath-infra).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC token; the AWS role only trusts pushes to main

env:
  AWS_REGION: us-east-2
  REGISTRY: 138257835519.dkr.ecr.us-east-2.amazonaws.com

concurrency:
  group: build-${{ github.ref }}
  # A newer PR commit supersedes the old build. Never cancel a main push
  # halfway through an upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: Dockerfile
          - image: migrate
            dockerfile: Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - name: Image tag = short commit SHA
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: AWS credentials (main only)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64 # the ECS cluster runs x86 t3 instances
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/brightpath/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          push: ${{ github.event_name == 'push' }}
          provenance: false # plain image manifest, no attestation index
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "brightpath/${{ matrix.image }}:${{ steps.meta.outputs.tag }} (pushed: ${{ github.event_name == 'push' }})" >> "$GITHUB_STEP_SUMMARY"
